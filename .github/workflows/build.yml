name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-arch: x64
            pip-constraints: ""
          - os: macos-14
            target: aarch64-apple-darwin
            python-arch: arm64
            pip-constraints: "-c backend/constraints-macos12.txt"
          - os: macos-13
            target: x86_64-apple-darwin
            python-arch: x64
            pip-constraints: "-c backend/constraints-macos12.txt"
    runs-on: ${{ matrix.os }}

    env:
      # Only affects the macOS/native build; harmless (unused) on Windows.
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri

      - name: Setup FFmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: npm install @ffmpeg-installer/ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ${{ matrix.pip-constraints }}
          pip install pyinstaller

      - name: Build Python Backend
        run: |
          pyinstaller --clean backend.spec -y

      - name: Prepare bin directory with Backend and FFmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cat << 'EOF' > copy_bin.py
          import os, sys, shutil, subprocess
          os.makedirs('src-tauri/bin', exist_ok=True)
          exe_ext = '.exe' if sys.platform == 'win32' else ''

          target = '${{ matrix.target }}'

          # Copy backend executable with target triplet (for Tauri externalBin)
          shutil.copy(os.path.join('dist', f'backend{exe_ext}'), os.path.join('src-tauri', 'bin', f'backend-{target}{exe_ext}'))

          # Copy ffmpeg executable
          try:
              ffmpeg_path = subprocess.check_output(['node', '-e', "console.log(require('@ffmpeg-installer/ffmpeg').path)"]).decode('utf-8').strip()
              shutil.copy(ffmpeg_path, os.path.join('src-tauri', 'bin', f'ffmpeg{exe_ext}'))
          except Exception as e:
              print('Error: ffmpeg not found!', e)
              sys.exit(1)
          EOF
          python copy_bin.py

      - name: Prepare bin directory with Backend and native FFmpeg (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          # Backend: copy PyInstaller output to Tauri externalBin naming convention.
          cp "dist/backend" "src-tauri/bin/backend-${{ matrix.target }}"
          # FFmpeg: fetch a NATIVE static build for this runner's arch
          # (ffmpeg-static ships darwin-arm64 and darwin-x64 — no Rosetta needed).
          npm install ffmpeg-static@5
          cp "$(node -e "console.log(require('ffmpeg-static'))")" src-tauri/bin/ffmpeg
          chmod +x src-tauri/bin/ffmpeg "src-tauri/bin/backend-${{ matrix.target }}"
          # Fail fast if the wrong architecture slipped in.
          echo "--- arch check ---"
          file "src-tauri/bin/ffmpeg" "src-tauri/bin/backend-${{ matrix.target }}"

      - name: Ad-hoc codesign macOS binaries
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          # Unsigned PyInstaller/FFmpeg Mach-O binaries are frequently "Killed: 9"
          # by macOS on launch. An ad-hoc signature lets them run once quarantine
          # is cleared (via `brew --no-quarantine` or `xattr -cr`).
          chmod +x "src-tauri/bin/backend-${{ matrix.target }}" "src-tauri/bin/ffmpeg" || true
          codesign --force --deep --sign - "src-tauri/bin/backend-${{ matrix.target }}"
          codesign --force --sign - "src-tauri/bin/ffmpeg" || true
          codesign --verify --verbose "src-tauri/bin/backend-${{ matrix.target }}"

      - name: Install Node.js dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Auto Clipper v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
